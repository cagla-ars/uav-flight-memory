[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-flight-memory"
version = "0.1.0"
description = "KNN-based historical flight similarity and anomaly diagnosis for UAV-SEAD"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "joblib>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

